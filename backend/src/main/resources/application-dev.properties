#Swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL / Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/cine_reserve
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=cine_user
spring.datasource.password=cine_password

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT
api.security.token.secret=${JWT_SECRET:dev-secret-very-long-and-random}
api.security.token.expiration=${JWT_EXPIRATION:2}
api.security.refresh.expiration=${JWT_REFRESH_EXPIRATION:60}
api.security.token.issuer=cinema-api-dev
login.max-attempts=5
login.lock-duration-minutes=5

# Admin user
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.nome=Administrador DEV
app.admin.email=admin@dev.local
app.admin.cpf=00000000000

# Cinema Admin user
app.cinema-admin.password=${CINEMA_ADMIN_PASSWORD:admin123}
app.cinema-admin.nome=Cinema Admin DEV
app.cinema-admin.email=cinema_admin@dev.local
app.cinema-admin.cpf=11111111111

# Cache
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
cache.ttl.genres=21600
cache.ttl.movies=3600
cache.ttl.rooms=86400
cache.ttl.standard=3600
cache.ttl.short=600

# Mail
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logs (DEV)
logging.file.path=logs
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG

# Mercado Pago (DEV - sandbox)
mercadopago.access.token=${MP_ACCESS_TOKEN}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}

# Intervalo em ms para expiracao automatica de reservas
seat.reservation.expiration.fixed-rate-ms=60000

# Hash Secret
security.hash.secret=${HASH_SECRET:dev-secret-123}

cinereserve.payment.pix.expiration-minutes=30
cinereserve.sse.timeout-ms=600000

# Retries
cinereserve.payment.retry.max-attempts=5
cinereserve.payment.retry.interval-seconds=30

spring.rabbitmq.listener.simple.prefetch=50

# MercadoPago HTTP client timeouts
mercadopago.http.connection-timeout-ms=5000
mercadopago.http.socket-timeout-ms=10000

# Resilience4j — Circuit Breaker
resilience4j.circuitbreaker.instances.mercadopago-gateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.mercadopago-gateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mercadopago-gateway.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.mercadopago-gateway.permitted-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mercadopago-gateway.sliding-window-type=COUNT_BASED

# Resilience4j — Time Limiter
resilience4j.timelimiter.instances.mercadopago-gateway.timeout-duration=10s
resilience4j.timelimiter.instances.mercadopago-gateway.cancel-running-future=true

# HikariCP Pool Sizing
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true