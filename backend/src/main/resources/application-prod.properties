# Swagger
springdoc.swagger-ui.enabled=false

# Database (PROD)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Security / JWT
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION}
api.security.refresh.expiration=${JWT_REFRESH_EXPIRATION}
api.security.token.issuer=cinema-api
login.max-attempts=3
login.lock-duration-minutes=15

# Admin user
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nome=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.cpf=${ADMIN_CPF}

# Cache (PROD - Redis)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
cache.ttl.genres=${CACHE_TTL_GENRES:86400}
cache.ttl.movies=${CACHE_TTL_MOVIES:21600}
cache.ttl.rooms=${CACHE_TTL_ROOMS:604800}
cache.ttl.standard=${CACHE_TTL_STANDARD:3600}
cache.ttl.short=${CACHE_TTL_SHORT:600}

# Mail (PROD)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logs (PROD)
logging.file.path=/var/log/cinema-api
logging.file.name=application.log
logging.level.root=INFO

# API Mercado Pago
mercadopago.access.token=${MP_ACCESS_TOKEN}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}

# Intervalo em ms para expiracao automatica de reservas
seat.reservation.expiration.fixed-rate-ms=${SEAT_RESERVATION_EXPIRATION_FIXED_RATE_MS:60000}

# Hash Secret
security.hash.secret=${HASH_SECRET}

cinereserve.payment.pix.expiration-minutes=${PIX_EXPIRATION_MINUTES:30}
cinereserve.sse.timeout-ms=${SSE_TIMEOUT_MS:600000}

# Retries
cinereserve.payment.retry.max-attempts=${PAYMENT_RETRY_MAX_ATTEMPTS:5}
cinereserve.payment.retry.interval-seconds=${PAYMENT_RETRY_INTERVAL_SECONDS:30}

spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:50}

# MercadoPago HTTP client timeouts
mercadopago.http.connection-timeout-ms=${MP_CONNECTION_TIMEOUT_MS:5000}
mercadopago.http.socket-timeout-ms=${MP_SOCKET_TIMEOUT_MS:10000}

# Resilience4j — Circuit Breaker
resilience4j.circuitbreaker.instances.mercadopago-gateway.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.mercadopago-gateway.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.mercadopago-gateway.wait-duration-in-open-state=${CB_WAIT_DURATION_OPEN:60s}
resilience4j.circuitbreaker.instances.mercadopago-gateway.permitted-calls-in-half-open-state=${CB_PERMITTED_HALF_OPEN:3}
resilience4j.circuitbreaker.instances.mercadopago-gateway.sliding-window-type=COUNT_BASED

# Resilience4j — Time Limiter
resilience4j.timelimiter.instances.mercadopago-gateway.timeout-duration=${CB_TIMEOUT_DURATION:10s}
resilience4j.timelimiter.instances.mercadopago-gateway.cancel-running-future=true

# HikariCP Pool Sizing
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:40}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:20000}

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.metrics.enabled=true