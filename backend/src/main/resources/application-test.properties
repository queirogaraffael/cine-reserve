# Swagger
springdoc.swagger-ui.enabled=false
spring.flyway.enabled=false

# Database (H2 isolado)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security / JWT
api.security.token.secret=test-secret
api.security.token.expiration=1
api.security.refresh.expiration=5
api.security.token.issuer=cinema-api-test
login.max-attempts=5
login.lock-duration-minutes=5

# Admin user
app.admin.username=test
app.admin.password=test
app.admin.nome=Admin Test
app.admin.email=test@test.local
app.admin.cpf=11111111111

# Cache (TEST)
spring.cache.type=none
cache.ttl.genres=3600
cache.ttl.movies=3600
cache.ttl.rooms=3600

# Mail
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.test-connection=false
spring.rabbitmq.listener.simple.auto-startup=false

# Logs
logging.level.root=WARN

# Mercado Pago
mercadopago.access.token=test-token
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:test-secret}

# Intervalo em ms para expiracao automatica de reservas
seat.reservation.expiration.fixed-rate-ms=${SEAT_RESERVATION_EXPIRATION_FIXED_RATE_MS:60000}

# Hash Secret
security.hash.secret=${HASH_SECRET:test-secret-123}

cinereserve.payment.pix.expiration-minutes=30

spring.rabbitmq.listener.simple.prefetch=50

cinema.session.availability-cutoff-minutes=60