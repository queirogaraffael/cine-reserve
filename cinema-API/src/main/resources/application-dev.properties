spring.application.name=cinema.api

# Configuracao do Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracao do datasource (H2 em memoria)
spring.datasource.url=jdbc:h2:mem:cinema;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2
spring.datasource.initialization-mode=always

# Configuracao JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Spring Security
api.security.token.secret=${JWT_SECRET:my-secret-key}
api.security.token.expiration=${JWT_EXPIRATION:2}
api.security.token.issuer=${JWT_ISSUER:cinema-api}

# Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= ${email}
spring.mail.password= ${email_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
