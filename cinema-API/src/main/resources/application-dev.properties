#Swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# H2
spring.datasource.url=jdbc:h2:mem:cinema;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT
api.security.token.secret=${JWT_SECRET:dev-secret-very-long-and-random}
api.security.token.expiration=${JWT_EXPIRATION:2}
api.security.refresh.expiration=${JWT_REFRESH_EXPIRATION:60}
api.security.token.issuer=cinema-api-dev
login.max-attempts=5
login.lock-duration-minutes=5

# Admin user
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.nome=Administrador DEV
app.admin.email=admin@dev.local
app.admin.cpf=00000000000

# Cache
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
cache.ttl=${CACHE_TTL:3600}
cache.ttl.standard=3600
cache.ttl.short=600

# Mail
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logs (DEV)
logging.file.path=logs
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG

# Mercado Pago (DEV - sandbox)
mercadopago.access.token=${MP_ACCESS_TOKEN}

# Intervalo em ms para expiração automática de reservas
seat.reservation.expiration.fixed-rate-ms=60000

# Hash Secret
security.hash.secret=${HASH_SECRET:dev-secret-123}