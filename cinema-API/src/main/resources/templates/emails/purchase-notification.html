<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Compra realizada</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
<table align="center" width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 20px; margin-top: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <tr>
        <td style="text-align: center; padding-bottom: 20px;">
            <h1 style="color: #2c3e50;">CineMaster 🎬</h1>
            <p style="color: #7f8c8d; font-size: 14px;">Confirmação da sua compra</p>
        </td>
    </tr>
    <tr>
        <td>
            <h2 style="color: #2c3e50;">Olá, <span th:text="${userName}">Usuário</span>!</h2>
            <p style="color: #34495e;">Obrigado pela sua compra em <strong th:text="${purchaseDate}">data</strong>.</p>
            <table width="100%" cellpadding="10" cellspacing="0" style="border: 1px solid #ecf0f1; border-radius: 5px; margin-top: 10px;">
                <tr style="background-color: #ecf0f1; font-weight: bold;">
                    <td>Filme</td>
                    <td>Sessão</td>
                    <td>Assento</td>
                    <td>Total</td>
                </tr>
                <tr style="text-align: center;">
                    <td th:text="${movieTitle}">Filme</td>
                    <td th:text="${sessionDateTime}">Data e hora</td>
                    <td th:text="${ticketSeat}">A1</td>
                    <td>R$ <span th:text="${totalPrice}">0,00</span></td>
                </tr>
            </table>
            <p style="margin-top: 20px; color: #7f8c8d; font-size: 12px;">Se você não reconhece essa compra, entre em contato com nosso suporte imediatamente.</p>
            <p style="margin-top: 10px; color: #7f8c8d; font-size: 12px;">&copy; 2025 CineMaster. Todos os direitos reservados.</p>
        </td>
    </tr>
</table>
</body>
</html>
