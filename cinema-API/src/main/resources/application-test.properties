# Swagger
springdoc.swagger-ui.enabled=false

# Database (H2 isolado)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security / JWT
api.security.token.secret=test-secret
api.security.token.expiration=1
api.security.refresh.expiration=5
api.security.token.issuer=cinema-api-test
login.max-attempts=999
login.lock-duration-minutes=0

# Admin user
app.admin.username=test
app.admin.password=test
app.admin.nome=Admin Test
app.admin.email=test@test.local
app.admin.cpf=11111111111

# Cache (TEST)
spring.cache.type=none

# Mail
spring.mail.test-connection=false

# Logs
logging.level.root=WARN

# Mercado Pago
mercadopago.access.token=test-token